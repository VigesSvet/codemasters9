<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Филиалы — Госархив ВКО</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="branches" data-hdr="solid" data-nofooter="1">
<main id="main">
  <div class="mwrap">
    <aside class="mside">
      <div class="mtools">
        <input class="inp" id="bq" data-i18n-ph="m.ph" aria-label="Search">
        <span class="sel"><select class="inp" id="bt"></select><svg><use href="#i-d"/></svg></span>
      </div>
      <ul class="blist" id="blist"></ul>
      <div class="bcard" id="bcard"></div>
    </aside>
    <div id="map" role="application" aria-label="Map"></div>
  </div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="i18n-home.js"></script>
<script src="i18n-more.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function(){
  const {L,t,esc}=APP,$=s=>document.querySelector(s);
  const qp=new URLSearchParams(location.search);
  let sel=qp.get("b")||"main", type="all", q="", from=null;
  const FROMS={ukg:[49.9484,82.6283],sem:[50.4111,80.2275],rid:[50.3446,83.5103],alt:[49.7167,84.2667],zai:[47.4681,84.8752]};
  const map=L_map();
  function L_map(){ const m=window.L?window.L.map("map",{scrollWheelZoom:false}).setView([49.95,82.6],7):null; if(m) window.L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap contributors"}).addTo(m); return m; }
  const markers={};
  function mk(){
    if(!map) return;
    Object.values(markers).forEach(m=>m.remove());
    BRANCHES.forEach(b=>{ const m=window.L.marker([b.lat,b.lon],{icon:window.L.divIcon({className:"",html:`<div class="pin${b.id===sel?" on":""}">${b.n}</div>`,iconSize:[30,30],iconAnchor:[15,15]}),title:L(b.name)}).addTo(map); m.on("click",()=>{sel=b.id;render(true);}); markers[b.id]=m; });
  }
  const km=(a,b)=>{const r=Math.PI/180,d=Math.acos(Math.min(1,Math.sin(a[0]*r)*Math.sin(b[0]*r)+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.cos((a[1]-b[1])*r)))*6371;return Math.round(d*1.25);};
  function render(fly){
    $("#bt").innerHTML=[["all","m.all"],["main","m.main"],["reading","m.reading"],["branch","m.branch"]].map(o=>`<option value="${o[0]}"${type===o[0]?" selected":""}>${t(o[1])}</option>`).join("");
    const list=BRANCHES.filter(b=>(type==="all"||b.type===type)&&(!q||(L(b.name)+" "+L(PLACES[b.city])+" "+L(b.addr)).toLowerCase().includes(q)));
    $("#blist").innerHTML=list.map(b=>`<li aria-selected="${b.id===sel}"><button data-b="${b.id}"><span class="n">${b.n}</span><span><b>${esc(L(b.name))}</b><small>${esc(L(b.addr))}</small></span></button></li>`).join("")||`<li style="padding:16px">${t("cat.none")}</li>`;
    const b=BRANCHES.find(x=>x.id===sel)||BRANCHES[0];
    const ll=`${b.lat},${b.lon}`, g=`https://www.google.com/maps/dir/?api=1&destination=${ll}${from?`&origin=${from[0]},${from[1]}`:""}`, d=`https://2gis.kz/directions/points/${from?`${from[1]},${from[0]}`:""}%7C${b.lon},${b.lat}`;
    $("#bcard").innerHTML=`<span class="st st--${b.type==="main"?"lim":"open"}">${t("m."+b.type)}</span><h2>${esc(L(b.name))}</h2><p style="margin:0 0 14px;color:var(--text2)">${esc(L(b.desc))}</p>
<dl><div class="p"><dt>${t("m.addr")}</dt><dd>${esc(L(b.addr))}</dd></div><div class="p"><dt>${t("m.tel")}</dt><dd class="mono">${b.phones.map(p=>`<a href="tel:${p.replace(/[^\d+]/g,"")}">${p}</a>`).join("<br>")}</dd></div><div class="p"><dt>Email</dt><dd class="mono">${b.email?`<a href="mailto:${b.email}">${b.email}</a>`:t("m.noemail")}</dd></div><div class="p"><dt>${t("m.hours")}</dt><dd>${esc(L(b.hours))}</dd></div><div class="p"><dt>${t("m.funds")}</dt><dd>${esc(L(b.funds))}</dd></div><div class="p"><dt>${t("m.coords")}</dt><dd class="mono">${b.lat.toFixed(4)}, ${b.lon.toFixed(4)}</dd></div>${from?`<div class="p"><dt>${t("m.dist")}</dt><dd class="dist">≈ ${km(from,[b.lat,b.lon])} ${t("m.km")}</dd></div>`:""}</dl>
<div class="route"><span class="lbl">${t("m.from")}</span><span class="sel"><select class="inp" id="from"><option value="">${t("m.pick")}</option>${Object.keys(FROMS).map(k=>`<option value="${k}">${esc(L(PLACES[k]))}</option>`).join("")}</select><svg><use href="#i-d"/></svg></span><button class="btn btn--sec" type="button" id="geo">${t("m.geo")}</button>
<div class="two"><a class="btn" href="${d}" target="_blank" rel="noopener">${t("m.2gis")}</a><a class="btn btn--sec" href="${g}" target="_blank" rel="noopener">Google Maps</a></div><p class="rnote">${t("m.geonote")}</p><p class="rnote">${t("m.coordsrc")}: ${esc(b.geosrc)}</p></div>`;
    if(from) $("#from").value=Object.keys(FROMS).find(k=>FROMS[k]===from)||"";
    mk(); if(map&&fly) map.flyTo([b.lat,b.lon],b.id==="main"||b.id==="reading"||b.id==="ukg"?13:12,{duration:.6});
    if(map&&!fly&&!render.done){ if(qp.get("b")) map.setView([b.lat,b.lon],13); else map.fitBounds(BRANCHES.map(x=>[x.lat,x.lon]),{padding:[50,50]}); render.done=1; }
  }
  document.addEventListener("click",e=>{ const b=e.target.closest("[data-b]"); if(b){ sel=b.dataset.b; render(true); }
    if(e.target.closest("#geo")){ if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>{from=[p.coords.latitude,p.coords.longitude];render();},()=>{alert(t("m.denied"));}); } });
  document.addEventListener("change",e=>{ if(e.target.id==="bt"){type=e.target.value;render();} if(e.target.id==="from"){from=e.target.value?FROMS[e.target.value]:null;render();} });
  $("#bq").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();render();});
  window.addEventListener("langchange",()=>render());
  window.addEventListener("themechange",()=>{});
  render(); if(map) setTimeout(()=>map.invalidateSize(),200);
})();
</script>
</body>
</html>
