<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Новость — Госархив ВКО</title>
<meta name="description" content="Новость Государственного архива ВКО.">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="p-api.css">
</head>
<body data-nav="">
<div class="readbar" aria-hidden="true"><i id="rb"></i></div>
<div id="top"></div>
<main id="main">
<div class="crumbs"><div class="wrap">
 <ol aria-label="Вы здесь"><li><a href="index.html" data-kk="Басты бет" data-en="Home">Главная</a></li><li><a href="news.html" data-kk="Жаңалықтар" data-en="News">Новости</a></li><li aria-current="page" id="crumb">…</li></ol>
</div></div>
<div class="wrap art" id="art"></div>
<div class="wrap art-more" id="more"></div>
</main>
<div id="bottom"></div>
<script src="api.js"></script>
<script src="app.js"></script>
<script>
(function(){
  var id = new URLSearchParams(location.search).get("id");
  var art = document.getElementById("art"), more = document.getElementById("more");
  var last = null;
  function esc(v){ return window.gosEsc ? gosEsc(v) : String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function lang(){ return getLang() === "kk" ? "kk" : "ru"; }
  function title(o){ return lang() === "kk" ? (o.title_kk || o.title_ru || "") : (o.title_ru || o.title_kk || ""); }
  function lead(o){ return lang() === "kk" ? (o.lead_kk || o.lead_ru || "") : (o.lead_ru || o.lead_kk || ""); }
  function body(o){ return lang() === "kk" ? (o.html_kk || o.html_ru || "") : (o.html_ru || o.html_kk || ""); }
  var MON = { ru: ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"],
    kk: ["қаңтар","ақпан","наурыз","сәуір","мамыр","маусым","шілде","тамыз","қыркүйек","қазан","қараша","желтоқсан"],
    en: ["January","February","March","April","May","June","July","August","September","October","November","December"] };
  function fd(d){ return d ? d.slice(8,10) + "." + d.slice(5,7) + "." + d.slice(0,4) : ""; }
  function fdl(d){ if (!d) return ""; var L = lang(), m = +d.slice(5,7) - 1, day = +d.slice(8,10), y = d.slice(0,4);
    return L === "en" ? MON.en[m] + " " + day + ", " + y : day + " " + MON[L === "kk" ? "kk" : "ru"][m] + " " + y + (L === "kk" ? " ж." : ""); }
  function render(o){
    last = o;
    document.title = title(o) + " — Госархив ВКО";
    var crumb = document.getElementById("crumb");
    if (crumb) crumb.textContent = title(o).length > 48 ? title(o).slice(0, 46) + "…" : title(o);
    var url = location.href, ut = encodeURIComponent(url), tt = encodeURIComponent(title(o));
    art.innerHTML =
      '<article class="art-main">' +
      '<p class="art-kicker"><a class="chip" href="news.html">' + tr("Новости", "Жаңалықтар", "News") + '</a></p>' +
      '<h1 class="art-h">' + esc(title(o)) + '</h1>' +
      (lead(o) ? '<p class="art-lead">' + esc(lead(o)) + '</p>' : '') +
      '<div class="art-meta"><time datetime="' + esc(o.date) + '">' + fdl(o.date) + '</time><span>' + tr("Госархив ВКО", "ШҚО мемлекеттік архиві", "State Archive of East Kazakhstan") + '</span></div>' +
      '<div class="art-share"><span>' + tr("Поделиться:", "Бөлісу:", "Share:") + '</span><a href="https://t.me/share/url?url=' + ut + '&text=' + tt + '" target="_blank" rel="noopener">Telegram</a><a href="https://wa.me/?text=' + tt + '%20' + ut + '" target="_blank" rel="noopener">WhatsApp</a><button type="button" id="cp">' + tr("Скопировать ссылку", "Сілтемені көшіру", "Copy link") + '</button></div>' +
      (o.image ? '<figure class="art-fig"><img src="' + esc(o.image) + '" alt="' + esc(title(o)) + '"><figcaption>' + tr("Фото: Государственный архив ВКО", "Фото: ШҚО мемлекеттік архиві", "Photo: State Archive of East Kazakhstan") + '</figcaption></figure>' : '') +
      '<div class="art-body">' + body(o) + '</div>' +
      '<p class="art-tags"><a class="tag" href="news.html">' + tr("Все новости", "Барлық жаңалықтар", "All news") + '</a></p>' +
      '</article>' +
      '<aside class="art-side"><h2>' + tr("Новости архива", "Архив жаңалықтары", "Archive news") + '</h2><p>' + tr("Сообщения о новых оцифрованных фондах и выставках.", "Жаңа цифрландырылған қорлар мен көрмелер туралы хабарлар.", "Updates on newly digitised fonds and exhibitions.") + '</p><a class="btn" href="news.html">' + tr("Все новости", "Барлық жаңалықтар", "All news") + ' ›</a></aside>';
    var cp = document.getElementById("cp");
    if (cp) cp.onclick = function(){ (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function(){ cp.textContent = tr("Ссылка скопирована", "Сілтеме көшірілді", "Link copied"); }, function(){ prompt("URL", url); }); };
  }
  if (!id) {
    art.innerHTML = '<div class="gos-state gos-state--empty">' + tr("Новость не выбрана.", "Жаңалық таңдалмады.", "No article selected.") + ' <a href="news.html">' + tr("К новостям", "Жаңалықтарға", "To the news") + '</a></div>';
  } else {
    gosState(art, "loading");
    window.gosApi.get("/api/news/" + encodeURIComponent(id)).then(function(o){ render(o); }).catch(function(err){
      if (err && err.name === "ApiError" && err.status === 404) gosState(art, "empty");
      else gosState(art, (err && err.name === "ApiError") ? "error" : "offline");
    });
  }
  window.onLang = function(){ if (last) render(last); };
  var rb = document.getElementById("rb");
  addEventListener("scroll", function(){ var r = art.getBoundingClientRect(); var p = Math.min(1, Math.max(0, -r.top / Math.max(1, r.height - innerHeight))); rb.style.transform = "scaleX(" + p + ")"; }, { passive: true });
})();
</script>
</body>
</html>
