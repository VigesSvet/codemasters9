<body data-base="../" data-admin data-page="filial">

   <div class="note" id="fil-403" style="display:none;color:#b3261e"></div>
   <div id="fil-form">
    <p class="ref" id="fil-name"></p>

     <div class="fld"><label for="b-phones" data-kk="Телефондар" data-en="Phones">Телефоны</label><input class="inp" id="b-phones"></div>
     <div class="fld"><label for="b-email" data-kk="Электрондық пошта" data-en="Email">Email</label><input class="inp" id="b-email"></div>
    </div>
    <div class="row2">
     <div class="fld"><label for="b-hours-ru" data-kk="Жұмыс уақыты (RU)" data-en="Hours (RU)">Часы работы (RU)</label><input class="inp" id="b-hours-ru"></div>
     <div class="fld"><label for="b-hours-kk" data-kk="Жұмыс уақыты (KZ)" data-en="Hours (KZ)">Часы работы (KZ)</label><input class="inp" id="b-hours-kk"></div>
    </div>
    <div class="fld"><label for="b-hours-en" data-kk="Жұмыс уақыты (EN)" data-en="Hours (EN)">Часы работы (EN)</label><input class="inp" id="b-hours-en"></div>
    <div class="row2">
     <div class="fld"><label for="b-addr-ru" data-kk="Мекенжай (RU)" data-en="Address (RU)">Адрес (RU)</label><input class="inp" id="b-addr-ru"></div>

    </div>
    <div class="fld"><label for="b-addr-en" data-kk="Мекенжай (EN)" data-en="Address (EN)">Адрес (EN)</label><input class="inp" id="b-addr-en"></div>
    <div class="row2">
     <div class="fld"><label for="b-lat" data-kk="Ендік (lat)" data-en="Latitude">Широта (lat)</label><input class="inp" id="b-lat" inputmode="decimal"></div>

    <div class="fld"><label for="b-head" data-kk="Басшы" data-en="Head">Руководитель</label><input class="inp" id="b-head"></div>
    <div class="fld"><label for="b-note" data-kk="Ескертпе" data-en="Note">Примечание</label><textarea class="inp" id="b-note"></textarea></div>
    <div class="stickybar"><button class="btn" type="button" id="fil-save" data-kk="Сақтау" data-en="Save">Сохранить</button></div>
