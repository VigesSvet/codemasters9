<script>
(function(){
var N=window.NEWS,PER=20,pg=1,y=new URLSearchParams(location.search).get("year")||"";
var sel=document.getElementById("ny"),q=document.getElementById("nq"),L=document.getElementById("nlist"),P=document.getElementById("npager"),C=document.getElementById("ncount");
sel.value=y;
function lg(){return getLang()==="kk"?1:0}
function pick(a){var i=lg();return a[i]||a[1-i]||""}
function fd(d){return d.slice(8,10)+"."+d.slice(5,7)+"."+d.slice(0,4)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function render(){
 var v=N.filter(function(o){return(!sel.value||o.d.slice(0,4)===sel.value)&&(!q.value||pick(o.t).toLowerCase().indexOf(q.value.toLowerCase())>-1)});
 var pages=Math.max(1,Math.ceil(v.length/PER));if(pg>pages)pg=pages;
 C.textContent=tr("Найдено: ","Табылды: ","Found: ")+v.length+tr(" из "," / "," of ")+N.length;
 L.innerHTML=v.slice((pg-1)*PER,pg*PER).map(function(o){
  return '<article class="ni">'+(o.i?'<a href="novost.html?id='+o.id+'"><img src="'+o.i+'" alt="" loading="lazy"></a>':'<span class="nph"></span>')+'<div><time datetime="'+o.d+'">'+fd(o.d)+'</time><h3><a href="novost.html?id='+o.id+'">'+esc(pick(o.t))+'<span class="chev"></span></a></h3><p>'+esc(pick(o.a))+'</p></div></article>'}).join("");
 var b="";for(var i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-pg)<=2)b+='<button data-p="'+i+'"'+(i===pg?' aria-current="page"':"")+'>'+i+'</button>';else if(Math.abs(i-pg)===3)b+='<span>…</span>'}
 P.innerHTML=b;
}
P.addEventListener("click",function(e){var t=e.target.closest("[data-p]");if(t){pg=+t.dataset.p;render();window.scrollTo(0,document.getElementById("nf").offsetTop)}});
sel.onchange=q.oninput=function(){pg=1;render()};
window.onLang=function(){render()};
render();
})();
</script>
