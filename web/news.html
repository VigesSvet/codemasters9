<body data-nav="">

<main id="main">
<div class="crumbs"><div class="wrap">
 <ol aria-label="Вы здесь"><li><a href="index.html" data-kk="Басты бет" data-en="Home">Главная</a></li><li><span data-kk="Жаңалықтар" data-en="News">Новости</span></li><li aria-current="page" data-kk="Жаңалықтар мен іс-шаралар" data-en="News and events">Новости и события</li></ol>
</div></div>
<section class="hero sm"><div class="wrap">
 <h1 data-kk="Жаңалықтар мен іс-шаралар" data-en="News and events">Новости и события</h1>
 <p class="sub" data-kk="Жаңалықтар мұрағаты: 638 жазба, 2012-2026." data-en="News archive: 638 items, 2012-2026.">Архив новостей: 638 записей, 2012-2026. Фильтр по году и заголовку.</p>
</div></section>
<div class="wrap doc">
 <nav class="sidenav" aria-label="Разделы"><h2><span data-kk="Жаңалықтар" data-en="News">Новости</span></h2><a href="news.html"><span data-kk="Жаңалықтар" data-en="News">Новости</span></a><a href="news.html?all=1"><span data-kk="Жаңалықтар мұрағаты" data-en="News archive">Архив новостей</span></a><a href="obyavleniya.html"><span data-kk="Хабарландырулар" data-en="Announcements">Объявления</span></a><a href="oprosy.html"><span data-kk="Сауалнамалар мұрағаты" data-en="Polls archive">Архив опросов</span></a><a href="gostevaya.html"><span data-kk="Қонақтар кітабы" data-en="Guestbook">Гостевая книга</span></a></nav>
 <div>
<section>
 <form class="nf" id="nf" role="search" aria-label="Фильтр новостей">
  <div class="fld"><label for="ny" data-kk="Жыл" data-en="Year">Год</label><select class="inp" id="ny"><option value="" data-kk="Барлық жылдар" data-en="All years">Все годы</option><option value="2026">2026 (30)</option><option value="2025">2025 (35)</option><option value="2024">2024 (34)</option><option value="2023">2023 (35)</option><option value="2022">2022 (48)</option><option value="2021">2021 (53)</option><option value="2020">2020 (46)</option><option value="2019">2019 (97)</option><option value="2018">2018 (71)</option><option value="2017">2017 (78)</option><option value="2016">2016 (24)</option><option value="2015">2015 (17)</option><option value="2014">2014 (69)</option><option value="2012">2012 (1)</option></select></div>
  <div class="fld"><label for="nq" data-kk="Іздеу" data-en="Search">Поиск по заголовку</label><input class="inp" id="nq" type="search" data-phkk="Тақырып бойынша" data-phen="By title" placeholder="По заголовку"></div>
 </form>
 <p class="src" id="ncount" aria-live="polite"></p>
 <div id="nlist" class="nlist"></div>
 <nav class="pager" id="npager" aria-label="Страницы"></nav>
</section>
 </div>
</div>
</main>
<div id="bottom"></div>
<script src="api.js"></script>
<script src="app.js"></script>
<script>
(function(){
  var PER = 12, pg = 1, total = 0, items = [];
  var sel = document.getElementById("ny"), q = document.getElementById("nq");
  var L = document.getElementById("nlist"), P = document.getElementById("npager"), C = document.getElementById("ncount");
  function lang(){ return getLang() === "kk" ? "kk" : "ru"; }
  function esc(v){ return window.gosEsc ? gosEsc(v) : String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  function title(o){ return lang() === "kk" ? (o.title_kk || o.title_ru || "") : (o.title_ru || o.title_kk || ""); }
  function lead(o){ return lang() === "kk" ? (o.lead_kk || o.lead_ru || "") : (o.lead_ru || o.lead_kk || ""); }
  function fd(d){ return d ? d.slice(8,10) + "." + d.slice(5,7) + "." + d.slice(0,4) : ""; }
  function render(){
    var v = items;
    if (sel.value) v = v.filter(function(o){ return o.date && o.date.slice(0,4) === sel.value; });
    C.textContent = tr("Найдено: ", "Табылды: ", "Found: ") + v.length + tr(" из ", " / ", " of ") + items.length;
    L.innerHTML = v.map(function(o){
      return '<article class="ni">' + (o.image ? '<a href="novost.html?id=' + encodeURIComponent(o.id) + '"><img src="' + esc(o.image) + '" alt="" loading="lazy"></a>' : '<span class="nph"></span>') +
        '<div><time datetime="' + esc(o.date) + '">' + fd(o.date) + '</time><h3><a href="novost.html?id=' + encodeURIComponent(o.id) + '">' + esc(title(o)) + '<span class="chev"></span></a></h3><p>' + esc(lead(o)) + '</p></div></article>';
    }).join("");
    var pages = Math.max(1, Math.ceil(total / PER));
    var b = "";
    for (var i = 1; i <= pages; i++) {
      if (i === 1 || i === pages || Math.abs(i - pg) <= 2) b += '<button data-p="' + i + '"' + (i === pg ? ' aria-current="page"' : "") + ">" + i + "</button>";
      else if (Math.abs(i - pg) === 3) b += "<span>…</span>";
    }
    P.innerHTML = b;
  }
  function load(){
    gosState(L, "loading");
    window.gosApi.get("/api/news", { lang: lang(), q: q.value.trim(), page: pg, per_page: PER }).then(function(resp){
      items = (resp && resp.items) || (Array.isArray(resp) ? resp : []);
      total = (resp && resp.total) || items.length;
      if (!items.length) { gosState(L, "empty"); P.innerHTML = ""; C.textContent = ""; return; }
      render();
    }).catch(function(err){
      gosState(L, (err && err.name === "ApiError") ? "error" : "offline");
      P.innerHTML = ""; C.textContent = "";
    });
  }
  P.addEventListener("click", function(e){ var t = e.target.closest("[data-p]"); if (t) { pg = +t.dataset.p; load(); window.scrollTo(0, document.getElementById("nf").offsetTop); } });
  q.oninput = function(){ pg = 1; load(); };
  sel.onchange = function(){ render(); };
  window.onLang = function(){ if (items.length) render(); else load(); };
  load();
})();
</script>
</body>
</html>
