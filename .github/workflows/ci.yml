name: CI

on:
  push:
  pull_request:

# токен CI только на чтение репозитория(SEC-14) - шаги ничего не публикуют
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Аудит зависимостей (pip-audit, база PyPI/OSV)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --durations=5
      - name: Smoke (seed + uvicorn + curl)
        env:
          DB_PATH: /tmp/gos-archive.db
          FILES_DIR: /tmp/gos-files
        run: |
          python -m backend.seed
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          UVICORN_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/api/health
          curl --fail -G "http://127.0.0.1:8000/api/catalog/search" --data-urlencode "q=риддер"
          kill $UVICORN_PID || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes html-validate@9 "web/**/*.html"
      - run: python3 scripts/check_links.py web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
